name: Temporary MOEX Builder
on:
  push:
    branches:
      - master
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-moex-aggregation-20261001
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build derived MOEX aggregates
        run: python scripts/moex_aggregate_temp.py
      - name: Upload aggregate artifact
        uses: actions/upload-artifact@v4
        with:
          name: moex-aggregates
          path: output/
          if-no-files-found: error
          retention-days: 1
      - name: Commit outputs to temporary branch
        run: |
          git config user.name "chatgpt-data-builder"
          git config user.email "actions@users.noreply.github.com"
          git add output/
          git commit -m "Build MOEX weekly monthly quarterly yearly aggregates" || exit 0
          git push origin HEAD:chatgpt-moex-aggregation-20261001
