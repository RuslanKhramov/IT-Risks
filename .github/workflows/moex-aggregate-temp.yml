name: Build MOEX aggregates
on:
  push:
    branches:
      - chatgpt-moex-aggregation-20261001
    paths-ignore:
      - 'output/**'
  pull_request:
    branches:
      - master
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-moex-aggregation-20261001
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build aggregates
        run: python scripts/moex_aggregate_temp.py
      - name: Commit derived outputs
        run: |
          git config user.name "chatgpt-data-builder"
          git config user.email "actions@users.noreply.github.com"
          git add output/
          git commit -m "Build MOEX weekly monthly quarterly yearly aggregates" || exit 0
          git push origin HEAD:chatgpt-moex-aggregation-20261001
