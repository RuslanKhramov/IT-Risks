name: MOEX WP1 Research
on:
  push:
    branches: [research/moex-wp1-20261002]
    paths:
      - 'research/moex_wp1/**'
      - '.github/workflows/moex-wp1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install pandas numpy scipy statsmodels scikit-learn matplotlib pyarrow requests python-docx openpyxl
      - name: Run
        run: |
          python research/moex_wp1/run_wp1_v2.py
          python research/moex_wp1/post_wp1_v3.py
          python research/moex_wp1/build_wp1_package.py
          python research/moex_wp1/export_sample_only.py
      - name: Publish compact audit snapshot
        run: |
          mkdir -p wp1_results_snapshot
          cp results_v2/SUMMARY.md wp1_results_snapshot/
          cp results_v2/summary_metrics.json wp1_results_snapshot/
          cp results_v2/pair_price_discovery.csv wp1_results_snapshot/
          cp results_v2/rolling_price_discovery.csv wp1_results_snapshot/
          cp results_v2/rolling_year_summary.csv wp1_results_snapshot/ || true
          cp results_v2/drlvm_oos_benchmark.csv wp1_results_snapshot/
          cp results_v2/drlvm_coefficients.csv wp1_results_snapshot/
          cp results_v2/rccvm_oos_benchmark.csv wp1_results_snapshot/
          cp results_v2/price_discovery_valuation_joint.csv wp1_results_snapshot/ || true
          cp results_v3/SUMMARY_V3.md wp1_results_snapshot/
          cp results_v3/summary_v3.json wp1_results_snapshot/
          cp results_v3/dividends_merged.csv wp1_results_snapshot/
          cp results_v3/drlvm_v3_oos_benchmark.csv wp1_results_snapshot/
          cp results_v3/drlvm_v3_coefficients.csv wp1_results_snapshot/
          cp results_v3/rccvm_v3_oos_benchmark.csv wp1_results_snapshot/ || true
          cp results_v3/rccvm_v3_coefficients.csv wp1_results_snapshot/ || true
          cp results_v3/rolling_leadership_determinants.csv wp1_results_snapshot/
          cp results_v3/window_sensitivity.csv wp1_results_snapshot/
          cp results_v3/period_leadership_summary.csv wp1_results_snapshot/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wp1_results_snapshot
          git commit -m "Snapshot WP1 empirical audit" || true
          git push origin HEAD:research/moex-wp1-20261002 || true
      - name: Upload compact outputs
        uses: actions/upload-artifact@v4
        with:
          name: moex-wp1-v3-summary
          path: wp1_results_snapshot/
          retention-days: 7

      - name: Upload final publication package
        uses: actions/upload-artifact@v4
        with:
          name: WP1-Russian-Dual-Class-1997-2026-FINAL
          path: |
            WP1_Russian_Dual_Class_1997_2026_FINAL.zip
            wp1_final_package/WP1_Manuscript.docx
            wp1_final_package/WP1_Manuscript.md
            wp1_final_package/WP1_Empirical_Results.xlsx
            wp1_final_package/WP1_Hypotheses_and_Findings.csv
            wp1_final_package/README_REPRODUCIBILITY.md
          retention-days: 7

      - name: Upload sample-only export
        uses: actions/upload-artifact@v4
        with:
          name: WP1-sample-only
          path: wp1_sample_export/
          retention-days: 7
