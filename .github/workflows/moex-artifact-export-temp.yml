name: MOEX Artifact Export
on:
  push:
    branches:
      - master
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-moex-aggregation-20261001
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build aggregates
        run: python scripts/moex_aggregate_temp.py
      - name: Upload derived files
        uses: actions/upload-artifact@v4
        with:
          name: moex-aggregates-derived
          path: output/
          if-no-files-found: error
          compression-level: 9
          retention-days: 1
